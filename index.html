
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#245b83">
  <title>薬学リサーチAI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
        "Noto Sans JP", sans-serif;
      margin: 0;
      padding: 20px;
      background: #f3f6f9;
      color: #263238;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      color: #245b83;
      font-size: 25px;
      text-align: center;
      margin: 15px 0 25px;
    }

    h2 {
      font-size: 18px;
      color: #245b83;
      margin-top: 0;
    }

    .section {
      background: white;
      padding: 18px;
      margin-bottom: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 7px rgba(0,0,0,0.06);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5df;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin: 5px 0;
      border: none;
      border-radius: 8px;
      background: #245b83;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary {
      background: #477b9f;
    }

    button.green {
      background: #287b65;
    }

    button.gray {
      background: #687782;
    }

    .description {
      font-size: 13px;
      color: #65727c;
      line-height: 1.6;
      margin-top: 8px;
    }

    .status {
      font-size: 14px;
      color: #287b65;
      margin-top: 10px;
      min-height: 20px;
    }

    .footer {
      text-align: center;
      font-size: 12px;
      color: #87939c;
      margin: 25px 0;
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>薬学リサーチAI</h1>

    <div class="section">
      <h2>論文・文献検索</h2>

      <label for="keyword">調べたい内容</label>

      <input
        type="text"
        id="keyword"
        placeholder="例：PPI長期投与と骨折リスク"
      >

      <button onclick="searchPubmed()">
        PubMedで検索（英語）
      </button>

      <button class="secondary" onclick="searchJstage()">
        J-STAGEで検索（日本語）
      </button>

    <button class="gray" onclick="searchPubmedArticles()">
  PubMedの論文を日本語で読む
</button>

      <div id="status" class="status"></div>

      <p class="description">
        日本語で入力できます。PubMedでは検索語を英語に翻訳して検索します。
        同時検索ではPubMed・J-STAGE・CiNii Researchへのリンクをまとめて表示します。
      </p>
    </div>

    <div class="section">
      <h2>添付文書検索</h2>

      <label for="drug">医薬品名</label>

      <input
        type="text"
        id="drug"
        placeholder="例：アムロジピン"
      >

      <button onclick="searchPMDA(false)">
        医療用医薬品の添付文書
      </button>

      <button class="secondary" onclick="searchPMDA(true)">
        OTC医薬品の添付文書
      </button>

      <p class="description">
        PMDAの公式検索ページを開きます。
        検索ページ内で医薬品名を入力してください。
      </p>
    </div>

    <div class="footer">
      薬学リサーチAI
    </div>

  </div>

  <script>

    // 入力された検索語を取得
    function getKeyword(id) {
      const value = document.getElementById(id).value.trim();

      if (!value) {
        alert("検索ワードを入力してください。");
        return "";
      }

      return value;
    }


    // 日本語を英語に翻訳
    async function translateToEnglish(text) {

      const apiUrl =
        "https://api.mymemory.translated.net/get?q=" +
        encodeURIComponent(text) +
        "&langpair=ja|en";

      const response = await fetch(apiUrl);

      if (!response.ok) {
        throw new Error("翻訳に失敗しました");
      }

      const data = await response.json();

      if (
        !data.responseData ||
        !data.responseData.translatedText
      ) {
        throw new Error("翻訳結果がありません");
      }

      return data.responseData.translatedText;
    }


    // PubMed検索
    async function searchPubmed() {

      const q = getKeyword("keyword");
      if (!q) return;

      // 翻訳前にタブを開く
      const tab = window.open("about:blank", "_blank");

      if (!tab) {
        alert("新しいタブを開けませんでした。Safariの設定を確認してください。");
        return;
      }

      document.getElementById("status").textContent =
        "英語に翻訳しています...";

      try {

        const english = await translateToEnglish(q);

        const url =
          "https://pubmed.ncbi.nlm.nih.gov/?term=" +
          encodeURIComponent(english);

        tab.location.href = url;

        document.getElementById("status").textContent =
          "PubMedを検索しました。";

      } catch (error) {

        const url =
          "https://pubmed.ncbi.nlm.nih.gov/?term=" +
          encodeURIComponent(q);

        tab.location.href = url;

        document.getElementById("status").textContent =
          "翻訳できなかったため、日本語で検索しました。";
      }
    }


    // J-STAGE検索
    function searchJstage() {

      const q = getKeyword("keyword");
      if (!q) return;

      const url =
        "https://www.jstage.jst.go.jp/result/global/-char/ja?globalSearchKey=" +
        encodeURIComponent(q);

      window.open(url, "_blank");
    }


    // 検索結果ページ用の文字列処理
    function escapeHTML(text) {

      return String(text).replace(/[&<>"']/g, function(char) {
        const entities = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        };

        return entities[char];
      });
    }


    // 国内・海外を同時検索
    async function searchBoth() {

      const q = getKeyword("keyword");
      if (!q) return;

      // ユーザー操作の直後にタブを開いておく
      const resultTab = window.open("about:blank", "_blank");

      if (!resultTab) {
        alert("新しいタブを開けませんでした。");
        return;
      }

      resultTab.document.open();
      resultTab.document.write(`
        <!DOCTYPE html>
        <html lang="ja">
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>論文検索結果</title>
        </head>
        <body style="font-family:sans-serif;padding:20px;">
          <h2>論文検索結果</h2>
          <p>検索語：${escapeHTML(q)}</p>
          <p>英語への翻訳中です。しばらくお待ちください。</p>
        </body>
        </html>
      `);
      resultTab.document.close();

      let english = q;
      let translationMessage = "";

      try {
        english = await translateToEnglish(q);
      } catch (error) {
        translationMessage =
          "英訳できなかったため、PubMedも日本語で検索します。";
      }

      const pubmedUrl =
        "https://pubmed.ncbi.nlm.nih.gov/?term=" +
        encodeURIComponent(english);

      const jstageUrl =
        "https://www.jstage.jst.go.jp/result/global/-char/ja?globalSearchKey=" +
        encodeURIComponent(q);

      const ciniiUrl =
        "https://cir.nii.ac.jp/all?q=" +
        encodeURIComponent(q);

      const safeKeyword = escapeHTML(q);
      const safeEnglish = escapeHTML(english);
      const safeMessage = escapeHTML(translationMessage);

      const resultPage = `
        <!DOCTYPE html>
        <html lang="ja">
        <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>論文検索結果</title>

          <style>
            body {
              font-family: sans-serif;
              padding: 20px;
              background: #f3f6f9;
              color: #263238;
              line-height: 1.6;
            }

            h2 {
              color: #245b83;
            }

            .card {
              background: white;
              padding: 18px;
              margin: 14px 0;
              border-radius: 10px;
              border: 1px solid #ddd;
            }

            a {
              display: block;
              background: #245b83;
              color: white;
              padding: 15px;
              margin-top: 10px;
              border-radius: 8px;
              text-decoration: none;
              text-align: center;
              font-weight: bold;
            }

            .jstage {
              background: #477b9f;
            }

            .cinii {
              background: #287b65;
            }

            .note {
              color: #687782;
              font-size: 13px;
            }
          </style>
        </head>

        <body>

          <h2>論文検索結果</h2>

          <div class="card">
            <strong>日本語の検索ワード</strong>
            <p>${safeKeyword}</p>

            <strong>PubMed用の英語検索ワード</strong>
            <p>${safeEnglish}</p>

            <p class="note">${safeMessage}</p>
          </div>

          <div class="card">
            <strong>海外論文</strong>
            <a href="${pubmedUrl}" target="_blank">
              PubMedで検索する
            </a>
          </div>

          <div class="card">
            <strong>国内論文</strong>
            <a class="jstage" href="${jstageUrl}" target="_blank">
              J-STAGEで検索する
            </a>

            <a class="cinii" href="${ciniiUrl}" target="_blank">
              CiNii Researchで検索する
            </a>
          </div>

          <p class="note">
            各ボタンをタップすると、それぞれの検索結果が開きます。
          </p>

        </body>
        </html>
      `;

      resultTab.document.open();
      resultTab.document.write(resultPage);
      resultTab.document.close();
    }


    // PMDA検索
    function searchPMDA(otc) {

      const q = getKeyword("drug");
      if (!q) return;

      let url;

      if (otc) {
        url = "https://www.pmda.go.jp/PmdaSearch/otcSearch/";
      } else {
        url = "https://www.pmda.go.jp/PmdaSearch/iyakuSearch/";
      }

      window.open(url, "_blank");
    }

  </script>

</body>
</html>
